name: Smart Tender CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Build & Test ──────────────────────────────────────────────────────────
  build-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: smart_tender_test }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - name: Build all modules
        run: mvn clean install -DskipTests --no-transfer-progress
      - name: Run tests
        run: mvn test --no-transfer-progress
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: '**/target/surefire-reports/*.xml' }

  # ── Frontend Build ────────────────────────────────────────────────────────
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: angular-frontend/package-lock.json }
      - name: Install dependencies
        run: cd angular-frontend && npm ci
      - name: Build
        run: cd angular-frontend && npm run build:prod
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: angular-frontend/dist/ }

  # ── Docker Build & Push ───────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - name: Build JARs
        run: mvn clean package -DskipTests --no-transfer-progress
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with: { context: auth-service, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-auth-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-auth-service:latest" }
      - name: Build and push tender-fetch-service
        uses: docker/build-push-action@v5
        with: { context: tender-fetch-service, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-fetch-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-fetch-service:latest" }
      - name: Build and push tender-processing-service
        uses: docker/build-push-action@v5
        with: { context: tender-processing-service, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-processing-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-processing-service:latest" }
      - name: Build and push tender-search-service
        uses: docker/build-push-action@v5
        with: { context: tender-search-service, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-search-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-search-service:latest" }
      - name: Build and push user-profile-service
        uses: docker/build-push-action@v5
        with: { context: user-profile-service, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-profile-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-profile-service:latest" }
      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with: { context: notification-service, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-notification-service:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-notification-service:latest" }
      - name: Build and push angular-frontend
        uses: docker/build-push-action@v5
        with: { context: angular-frontend, push: true, tags: "${{ env.DOCKER_HUB_USERNAME }}/st-frontend:${{ env.IMAGE_TAG }},${{ env.DOCKER_HUB_USERNAME }}/st-frontend:latest" }

  # ── Deploy to K8s ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with: { method: kubeconfig, kubeconfig: "${{ secrets.KUBECONFIG }}" }
      - name: Deploy with Helm
        run: |
          helm upgrade --install smart-tender ./helm/smart-tender \
            --set global.imageTag=${{ env.IMAGE_TAG }} \
            --set global.dockerHubUsername=${{ env.DOCKER_HUB_USERNAME }} \
            --namespace smart-tender --create-namespace --wait
