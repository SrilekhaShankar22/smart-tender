apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: smart-tender
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: DOCKERHUB_USER/st-auth-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/smart_tender_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: smart-tender
spec:
  selector:
    app: auth-service
  ports:
    - port: 8084
      targetPort: 8084
