apiVersion: apps/v1
kind: Deployment
metadata:
  name: tender-fetch-service
  namespace: smart-tender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tender-fetch-service
  template:
    metadata:
      labels:
        app: tender-fetch-service
    spec:
      containers:
        - name: tender-fetch-service
          image: DOCKERHUB_USER/st-fetch-service:latest
          ports:
            - containerPort: 8081
          env:
            - {name: DB_USERNAME, valueFrom: {secretKeyRef: {name: db-secret, key: username}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: db-secret, key: password}}}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/smart_tender_fetch?useSSL=false&serverTimezone=UTC"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8081}
            initialDelaySeconds: 90
            periodSeconds: 15
          resources:
            requests: {memory: 256Mi, cpu: 250m}
            limits: {memory: 512Mi, cpu: 500m}
---
apiVersion: v1
kind: Service
metadata:
  name: tender-fetch-service
  namespace: smart-tender
spec:
  selector:
    app: tender-fetch-service
  ports:
    - port: 8081
      targetPort: 8081
