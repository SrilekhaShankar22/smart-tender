server:
  port: 8083
spring:
  application:
    name: tender-search-service
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.smarttender: DEBUG
