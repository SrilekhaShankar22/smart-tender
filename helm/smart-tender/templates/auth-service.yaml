apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.services.auth.replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.global.dockerHubUsername }}/st-auth-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: {{ .Values.services.auth.port }}
          env:
            - name: JWT_SECRET
              value: {{ .Values.services.auth.jwtSecret }}
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.auth.port }}
            initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: auth-service
  ports:
    - port: {{ .Values.services.auth.port }}
      targetPort: {{ .Values.services.auth.port }}
